version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb
        SPRING_DATASOURCE_USERNAME: arun
        SPRING_DATASOURCE_PASSWORD: user
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql:latest                  # Use official MySQL 8 image
    container_name: mysql_container     # Name of the container                   # Automatically restart if it stops
    environment:
      MYSQL_ROOT_PASSWORD: user
      MYSQL_DATABASE: mydb
      MYSQL_USER: arun
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306"
    restart: always